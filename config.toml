[strategy]
margin = 0.03

[strategy.fair]   # placeholders, not forecasts. Put YOUR own fair values here.
"KXNBASPREAD-26OCT28OKCDAL-OKC5" = 0.62
"KXNBASPREAD-26OCT28OKCDAL-OKC9" = 0.40
"KXNHLSPREAD-26OCT27MINUTA-MIN4" = 0.05

