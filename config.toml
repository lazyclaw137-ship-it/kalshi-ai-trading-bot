env = "demo"
poll_seconds = 10

[base_url]
demo = "https://external-api.demo.kalshi.co/trade-api/v2"
prod = "https://external-api.kalshi.com/trade-api/v2"   # override with KALSHI_PROD_BASE_URL (api.elections.kalshi.com also works)

[tickers]
# Example demo tickers (checked open on Oct 27, 2026). Markets expire: replace these with
